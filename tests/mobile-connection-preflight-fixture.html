<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>DayO mobile connection preflight fixture</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; font-family: sans-serif; background: #fff8f5; color: #5c4a42; }
    .room { min-height: 100dvh; background: linear-gradient(160deg, #2d2725, #6b5650); }
    .device-preflight { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(40,31,28,.66); backdrop-filter: blur(10px); }
    .device-preflight__card { width: min(100%, 420px); max-height: calc(100dvh - 32px); overflow-y: auto; padding: 20px; border: 1px solid rgba(255,255,255,.75); border-radius: 22px; background: #fffcfa; box-shadow: 0 22px 60px rgba(38,27,24,.26); }
    h2 { margin: 0 0 6px; font-size: 1.18rem; }
    .lead { margin: 0 0 14px; color: #9a8580; font-size: .86rem; line-height: 1.55; }
    .preview { display: grid; place-items: center; width: 100%; aspect-ratio: 16 / 9; border-radius: 16px; background: linear-gradient(135deg, #544b47, #282221); color: #fff; }
    .checks { display: grid; gap: 7px; margin: 13px 0; }
    .check { padding: 9px 11px; border-radius: 11px; background: #f5f0ed; font-size: .8rem; line-height: 1.45; }
    .ok { background: #e8f7ef; color: #176b45; }
    .phrase { margin: 10px 0 14px; padding: 11px; border: 1px solid #ffd1dc; border-radius: 12px; background: #fff6f3; text-align: center; font-weight: 700; }
    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    button { min-height: 44px; border: 0; border-radius: 12px; font: inherit; font-size: .82rem; font-weight: 700; }
    .primary { background: #ff6b57; color: #fff; }
    .secondary { background: #eee7e3; color: #5c4a42; }
    @media (max-height: 640px) { .device-preflight__card { padding: 14px; } .preview { max-height: 150px; } .lead { margin-bottom: 9px; } }
  </style>
</head>
<body>
  <div class="room"></div>
  <section class="device-preflight" role="dialog" aria-modal="true">
    <div class="device-preflight__card" id="fixtureCard">
      <h2>15초 연결 확인</h2>
      <p class="lead">영상·마이크 권한과 음성 인식은 서로 별개예요. 대화 전에 각각 확인해 주세요.</p>
      <div class="preview">카메라 미리보기</div>
      <div class="checks">
        <div class="check ok">카메라 미리보기가 준비됐어요.</div>
        <div class="check ok">마이크 입력이 감지됐어요.</div>
        <div class="check ok">마이크와 음성 인식이 준비됐어요.</div>
      </div>
      <div class="phrase">“Hello, nice to meet you.”</div>
      <div class="actions"><button class="primary">준비 완료</button><button class="secondary">확인 후 대화 시작</button></div>
    </div>
  </section>
</body>
</html>
