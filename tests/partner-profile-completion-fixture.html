<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Partner Completion — Local QA fixture</title><link rel="stylesheet" href="/partner-profile-completion.css"><style>body{margin:0;background:#fff8f5;color:#5c4a42;font-family:system-ui}main{max-width:900px;margin:24px auto;padding:16px}.qa{display:flex;flex-wrap:wrap;gap:8px;padding:16px;border-bottom:1px solid #ddd}.qa button{padding:10px}.page-heading{margin-bottom:24px}.pcp-dialog{font-family:system-ui}</style></head><body><div class="qa" aria-label="Local QA controls"><button id="qa-user">General user</button><button id="qa-partner">Incomplete partner</button><button id="qa-complete">Completed partner</button><button id="qa-relogin">Re-login</button><button id="qa-signout">Sign out</button><button id="qa-fail">Toggle save failure</button><button id="qa-reset">Reset fixture data</button><span id="qa-status" role="status"></span></div><main id="partner-dashboard-section"><div class="page-heading"><p>PARTNER LOUNGE</p><h1>Ready for your next conversation?</h1></div><section><h2>Existing Lounge</h2><p>Bookings, profile, availability and rewards stay available.</p></section></main><script>
(function(){
 var role='partner', user={id:'22222222-2222-4222-8222-222222222222'}, listeners=[], fail=false;
 var key='dayo-completion-local-fixture-v1';
 var example={partner_id:user.id,location_status:'overseas',visa_type:'not_applicable_overseas',native_languages:['English'],other_languages:[{language:'French',level:'fluent'}],session_languages:['English','French'],korean_level:'basic',availability_periods:['weekday_evening'],weekly_session_capacity:'3-5',partner_guide_acknowledged_at:'2026-10-03T00:00:00Z',completed_at:'2026-10-03T00:00:00Z'};
 var row=null; try{row=JSON.parse(localStorage.getItem(key))}catch(e){}
 function paint(){document.getElementById('qa-status').textContent='Role: '+(role||'signed out');document.getElementById('partner-dashboard-section').hidden=role!=='partner'}
 function emit(){paint();listeners.forEach(function(fn){fn('SIGNED_IN',user?{user:user}:null)});}
 window.supabaseClient={auth:{getSession:async function(){return{data:{session:user?{user:user}:null}}},onAuthStateChange:function(fn){listeners.push(fn);return{data:{subscription:{unsubscribe:function(){}}}}}},from:function(table){return{select:function(){return this},eq:function(){return this},maybeSingle:async function(){return table==='profiles'?{data:user?{role:role}:null,error:null}:{data:role==='partner'?row:null,error:null}}}},rpc:async function(name,args){if(name!=='save_partner_profile_completion'||role!=='partner'||fail)return{error:{message:'Fixture save failure'}};var p=args.p_details;if(!p.guide_acknowledged)return{error:{message:'Guide required'}};row=Object.assign({},p,{partner_id:user.id,partner_guide_acknowledged_at:row&&row.partner_guide_acknowledged_at||new Date().toISOString(),completed_at:row&&row.completed_at||new Date().toISOString()});localStorage.setItem(key,JSON.stringify(row));return{data:row,error:null}}};
 document.getElementById('qa-user').onclick=function(){role='user';user={id:'33333333-3333-4333-8333-333333333333'};emit()};
 document.getElementById('qa-partner').onclick=function(){role='partner';user={id:'22222222-2222-4222-8222-222222222222'};row=null;localStorage.removeItem(key);emit()};
 document.getElementById('qa-complete').onclick=function(){role='partner';user={id:'22222222-2222-4222-8222-222222222222'};row=example;localStorage.setItem(key,JSON.stringify(row));emit()};
 document.getElementById('qa-relogin').onclick=function(){role='partner';user={id:'22222222-2222-4222-8222-222222222222'};try{row=JSON.parse(localStorage.getItem(key))}catch(e){}emit()};
 document.getElementById('qa-signout').onclick=function(){role=null;user=null;emit()};
 document.getElementById('qa-fail').onclick=function(){fail=!fail;document.getElementById('qa-status').textContent='Save failure: '+fail};
 document.getElementById('qa-reset').onclick=function(){row=null;localStorage.removeItem(key);fail=false;emit()};
 paint();
})();
</script><script src="/partner-profile-completion.js"></script></body></html>
