<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>DayO conversation assist mobile fixture</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; font-family: sans-serif; background: linear-gradient(160deg,#332b28,#695750); color: #5c4a42; }
    .panel { position: fixed; left: 0; right: 0; bottom: 0; max-height: min(68dvh,540px); overflow-y: auto; padding: 10px 18px calc(18px + env(safe-area-inset-bottom)); border-radius: 24px 24px 0 0; background: #fffcfa; box-shadow: 0 -12px 40px rgba(0,0,0,.2); }
    .handle { width: 40px; height: 4px; margin: 0 auto 12px; border-radius: 99px; background: #d9ccc6; }
    h1 { margin: 0 0 8px; font-size: 18px; }
    p { margin: 0 0 12px; color: #8b7770; font-size: 13px; line-height: 1.5; }
    textarea { width: 100%; min-height: 72px; padding: 12px; border: 1px solid #ffd1dc; border-radius: 14px; background: #fff8f5; font: inherit; resize: vertical; }
    .primary { width: 100%; min-height: 46px; margin-top: 9px; border: 0; border-radius: 13px; background: #ff6b57; color: #fff; font-weight: 800; }
    .results { display: grid; gap: 8px; margin-top: 12px; }
    .result { padding: 11px 12px; border: 1px solid #ffd1dc; border-radius: 13px; background: #fff8f5; }
    .result strong, .result span { display: block; }
    .result span { margin-top: 3px; color: #8b7770; font-size: 12px; }
    .partner { max-width: 360px; margin: 18px auto; padding: 16px; border-radius: 18px; background: #fff9e8; }
    .partner button { min-height: 42px; border: 1px solid #247552; border-radius: 11px; background: #fff; color: #247552; font-weight: 800; }
    .partner .primary-question { width: 100%; background: #b8e2c8; }
    .questions { display: grid; gap: 8px; margin: 12px 0; font-size: 14px; line-height: 1.45; }
    [data-view="word"] .partner, [data-view="partner"] .word { display: none; }
  </style>
</head>
<body>
  <section class="panel word">
    <div class="handle"></div><h1>단어 도움</h1><p>무슨 말을 하고 싶나요?<br>한국어로 입력해도 괜찮아요.</p>
    <textarea>경치가 아름다웠지만 사람이 많았어요.</textarea><button class="primary">도움받기</button>
    <div class="results"><div class="result"><strong>beautiful scenery</strong><span>아름다운 경치</span></div><div class="result"><strong>crowded</strong><span>붐비는</span></div><div class="result"><strong>The scenery was beautiful, but it was crowded.</strong><span>경치는 아름다웠지만 붐볐어요.</span></div></div>
  </section>
  <section class="partner">
    <button class="primary-question">💡 다음 질문 추천</button>
    <div class="questions"><div>1. Do you prefer cities or nature?</div><div>2. What place do you remember most?</div><div>3. Where would you like to go next?</div></div>
    <button>다시 추천</button>
  </section>
  <script>document.body.dataset.view = new URLSearchParams(location.search).get('view') === 'partner' ? 'partner' : 'word';</script>
</body>
</html>
