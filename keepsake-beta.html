<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DayO limited keepsake beta</title>
<link rel="stylesheet" href="partner-report.css"><style>body{margin:24px auto;padding:0 16px;max-width:640px;background:#fffbf4;color:#33473e;font:16px system-ui}button,select{font:inherit;padding:10px;margin:8px 0}img{max-width:100%;height:auto}p{line-height:1.5}</style>
<h1>DayO limited keepsake beta</h1><p>This optional image never blocks your Partner Letter. Only exact-session verified themes are offered. The booking’s generating Partner reviews the exact image before customer publication.</p>
<a href="/partner">Normal Partner login</a> · <a href="/mypage">Normal User login</a>
<p id="status" role="status" aria-live="polite"></p><label>Verified theme <select id="topic"><option value="">Load verified themes first</option></select></label>
<div><button id="choices">Load verified themes</button><button id="generate" disabled>Request unpublished image</button><button id="read">Read approved image</button></div><img id="image" hidden alt="Approved conversation keepsake"><div id="letter-review-host"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-client.js"></script><script src="keepsake-partner-review.js"></script><script>
(()=>{let source='',pending=false;const booking=new URL(location.href).searchParams.get('bookingId'),status=document.getElementById('status'),image=document.getElementById('image');
const db=window.supabaseClient||window.supabase;let request=localStorage.getItem('dayo-keepsake-request:'+booking)||'';
async function send(route,body){const a=await db.auth.getSession(),jwt=a.data?.session?.access_token;if(!jwt)throw Error('Sign in normally first.');const r=await fetch(route,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+jwt},body:JSON.stringify(body),signal:AbortSignal.timeout(45000)}),data=await r.json();if(!r.ok)throw Error(data.error||'Status could not be confirmed.');return data;}
async function run(task){if(pending)return;pending=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);status.textContent='Checking…';try{await task();}catch(e){status.textContent=e.message;}finally{pending=false;document.getElementById('choices').disabled=false;document.getElementById('read').disabled=false;document.getElementById('generate').disabled=!source||!document.getElementById('topic').value;}}
document.getElementById('choices').onclick=()=>run(async()=>{const data=await send('/api/conversation-recap',{action:'partner_illustration_choices',booking_id:booking});source=data.source_version||'';const select=document.getElementById('topic');select.replaceChildren();for(const c of data.choices||[]){const o=document.createElement('option');o.value=c.id;o.textContent=c.label;select.append(o);}status.textContent=select.options.length?'Choose a verified theme.':'Insufficient verified evidence; text-only remains available.';});
document.getElementById('generate').onclick=()=>run(async()=>{if(!request){request=crypto.randomUUID();localStorage.setItem('dayo-keepsake-request:'+booking,request);}const data=await send('/api/conversation-recap',{action:'partner_illustration_generate',booking_id:booking,topic_id:document.getElementById('topic').value,source_version:source,request_id:request});status.textContent=data.status==='pending_review'?'Saved privately. Awaiting Partner review.':data.status;});
document.getElementById('read').onclick=()=>run(async()=>{image.hidden=true;image.removeAttribute('src');const data=await send('/api/conversation-recap',{action:'keepsake_review',review:{action:'read',booking_id:booking}});if(!data.image){status.textContent='No approved image available.';return;}if(data.image.approved!==true||data.image.content_type!=='image/png')throw Error('Unverified image.');image.src='data:image/png;base64,'+data.image.data;image.onload=()=>{image.hidden=false;status.textContent='Approved image displayed.';};});
})();</script><script>
(async()=>{try{const response=await fetch('/room.html');if(!response.ok)throw Error('component_unavailable');const source=new DOMParser().parseFromString(await response.text(),'text/html');const popup=source.getElementById('partner-report-popup');if(!popup)throw Error('component_unavailable');
popup.style.cssText='display:block;position:relative;inset:auto;z-index:auto';popup.removeAttribute('aria-modal');popup.querySelectorAll('[onclick]').forEach(el=>el.removeAttribute('onclick'));popup.querySelectorAll('button').forEach(el=>el.disabled=true);
const note=document.createElement('p');note.className='pr-hint';note.textContent='Historical TEST image review only. This page never submits a Letter or changes the session.';popup.querySelector('.pr-intro').after(note);
popup.querySelector('.pr-optional').hidden=true;document.getElementById('letter-review-host').append(popup);
await DayOKeepsakePartnerReview.open(new URL(location.href).searchParams.get('bookingId'),popup,localStorage.getItem('dayo_lang')==='KO'?'ko':'en');
}catch(_){document.getElementById('status').textContent='The existing Letter review component could not be loaded.';}})();
</script></html>
