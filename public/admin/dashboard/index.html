<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DayO 관리자 대시보드</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/supabase-env.js"></script>
  <script src="/supabase-client.js"></script>
  <script>
    async function checkAdminAuth() {
      try {
        var supabase = window.supabaseClient;
        if (!supabase || !supabase.auth || typeof supabase.auth.getSession !== 'function') {
          alert('관리자 로그인이 필요한 페이지입니다.');
          window.location.href = '/';
          return;
        }

        var sessionRes = await supabase.auth.getSession();
        var sessionData = (sessionRes && sessionRes.data) || {};
        var session = sessionData.session || null;
        var sessionError = sessionRes && sessionRes.error;

        if (sessionError || !session || !session.user) {
          alert('관리자 로그인이 필요한 페이지입니다.');
          window.location.href = '/';
          return;
        }

        var profile = null;
        var profileRes = await supabase
          .from('profiles')
          .select('role')
          .eq('id', session.user.id)
          .maybeSingle();

        if (profileRes && !profileRes.error && profileRes.data) {
          profile = profileRes.data;
        } else {
          var fallbackRes = await supabase
            .from('profiles')
            .select('role')
            .eq('user_id', session.user.id)
            .maybeSingle();
          if (fallbackRes && !fallbackRes.error && fallbackRes.data) {
            profile = fallbackRes.data;
          }
        }

        if (profile && profile.role === 'admin') {
          var loadingEl = document.getElementById('admin-loading') || document.querySelector('.admin-loading-screen');
          if (loadingEl) loadingEl.style.display = 'none';
          var dashboardEl = document.getElementById('admin-app') || document.querySelector('.dashboard-layout');
          if (dashboardEl) {
            dashboardEl.removeAttribute('hidden');
            dashboardEl.style.display = 'flex';
          }
          return;
        }

        alert('관리자(Admin) 권한이 없습니다.');
        window.location.href = '/';
      } catch (err) {
        console.error('Admin Auth Error:', err);
        alert('인증 확인 중 오류가 발생했습니다. 메인 페이지로 이동합니다.');
        window.location.href = '/';
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', checkAdminAuth);
    } else {
      checkAdminAuth();
    }
  </script>
  <style>
    :root {
      --dayo-coral: #F07A68;
      --dayo-charcoal: #3E4A42;
      --dayo-muted: #66756C;
      --dayo-border: #EDE4D5;
      --dayo-cream: #FFF9ED;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: 'Gowun Dodum', 'Apple SD Gothic Neo', sans-serif;
      background: var(--dayo-cream);
      color: var(--dayo-charcoal);
    }
    .admin-shell,
    .dashboard-layout {
      display: none;
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 20px;
      flex-direction: column;
    }
    .admin-card {
      background: #fff;
      border: 1px solid var(--dayo-border);
      border-radius: 20px;
      box-shadow: 0 16px 36px rgba(62, 74, 66, 0.08);
      padding: 28px 24px;
    }
    .admin-kicker { font-size: 12px; font-weight: 800; letter-spacing: 0.06em; color: var(--dayo-coral); margin-bottom: 8px; }
    h1 { font-size: 24px; margin-bottom: 8px; }
    p { color: var(--dayo-muted); line-height: 1.6; margin-bottom: 18px; }
    .admin-actions { display: flex; flex-wrap: wrap; gap: 10px; }
    .admin-actions a {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 10px 14px; border-radius: 999px; text-decoration: none; font-weight: 700; font-size: 14px;
    }
    .btn-home { background: var(--dayo-coral); color: #fff; }
    .admin-loading-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--dayo-muted);
    }
  </style>
</head>
<body>
  <div id="admin-loading" class="admin-loading-screen">관리자 권한을 확인하는 중...</div>
  <main id="admin-app" class="admin-shell dashboard-layout">
    <section class="admin-card">
      <p class="admin-kicker">ADMIN</p>
      <h1>관리자 대시보드</h1>
      <p>DayO 백오피스에 연결되었습니다. 권한이 확인된 관리자만 이 페이지를 볼 수 있습니다.</p>
      <div class="admin-actions">
        <a class="btn-home" href="/">메인으로 돌아가기</a>
      </div>
    </section>
  </main>
</body>
</html>
