  <style>
    .faq-header { gap: 1rem; font-family: 'Gowun Dodum', 'Quicksand', -apple-system, sans-serif; }
    .faq-nav { display: flex; align-items: center; gap: 1rem; margin-left: auto; }
    .faq-nav a { color: #5b443d; font-size: .84rem; font-weight: 600; text-decoration: none; }
    .faq-header .legal-home-btn { font-family: inherit; }
    .faq-language { display: flex; flex: 0 0 auto; margin-left: .15rem; }
    .faq-main { width: min(860px, calc(100% - 2rem)); margin: 0 auto; padding: 3rem 0 4.5rem; }
    .faq-kicker { margin: 0 0 .65rem; color: #5F7D63; font-size: .78rem; font-weight: 800; letter-spacing: .08em; }
    .faq-main h1 { margin: 0; color: #3f302b; font-size: clamp(2rem, 5vw, 3rem); line-height: 1.25; }
    .faq-lead { margin: .9rem 0 2rem; color: #76635d; line-height: 1.75; }
    .faq-list { display: grid; gap: .75rem; }
    .faq-list details { border: 1px solid rgba(95, 125, 99, .22); border-radius: 16px; background: #fffdfa; box-shadow: 0 8px 24px rgba(92, 65, 55, .06); overflow: hidden; }
    .faq-list summary { padding: 1rem 1.1rem; color: #3f302b; font-weight: 800; line-height: 1.55; cursor: pointer; }
    .faq-list p { margin: 0; padding: 0 1.1rem 1.1rem; color: #76635d; line-height: 1.75; word-break: keep-all; }
    .faq-list a { color: #5F7D63; font-weight: 800; }
    .faq-support { display: flex; flex-wrap: wrap; justify-content: center; gap: .75rem; margin-top: 2rem; }
    .faq-support a { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: .75rem 1.15rem; border-radius: 999px; font-weight: 800; text-decoration: none; }
    .faq-support__home { border: 1px solid rgba(95, 125, 99, .4); background: #fff; color: #5F7D63; }
    @media (max-width: 720px) {
      .faq-header { flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .5rem; }
      .faq-nav { order: 3; width: 100%; justify-content: center; gap: .8rem; padding-top: .65rem; border-top: 1px solid rgba(95, 125, 99, .14); }
      .faq-nav a { font-size: .8rem; }
      .faq-language { margin-left: auto; }
      .faq-main { padding-top: 2rem; }
      .faq-list summary { padding: .9rem 1rem; font-size: .92rem; }
      .faq-list p { padding: 0 1rem 1rem; font-size: .86rem; }
      .faq-support { align-items: stretch; flex-direction: column; }
      .faq-support a { width: 100%; box-sizing: border-box; }
    }
  </style>
