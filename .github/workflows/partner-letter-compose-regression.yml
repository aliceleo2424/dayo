name: Partner Letter Compose Regression

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  letter-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Locked visual order, personalized writing and source mirror checks
        run: node tests/partner-letter-compose-layout.cjs
      - name: Install isolated browser test tools (no runtime dependency change)
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1 jsdom@26.1.0
      - run: npx playwright install --with-deps chrome
      - name: Actual room DOM, Letter save/retry and customer feedback/recap interactions
        run: node tests/letter-post-session-browser.cjs

# Browser and server transports are synthetic. Do not claim physical-device or live DB acceptance.
