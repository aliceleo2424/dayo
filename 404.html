<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>페이지를 찾을 수 없어요 | DayO</title>
<meta name="description" content="찾으시는 페이지가 없거나 주소가 바뀌었어요. DayO 홈에서 다시 시작해 보세요.">
<link rel="icon" type="image/png" href="/images/logo-square.png">
<link rel="apple-touch-icon" href="/images/logo-square.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<script defer src="/_vercel/insights/script.js"></script>
<style>
@font-face{font-family:'NanumSquareRound';src:url('/fonts/NanumSquareRoundR.woff2') format('woff2');font-weight:400}
@font-face{font-family:'NanumSquareRound';src:url('/fonts/NanumSquareRoundB.woff2') format('woff2');font-weight:700}
@font-face{font-family:'NanumSquareRound';src:url('/fonts/NanumSquareRoundEB.woff2') format('woff2');font-weight:800}
:root{--ink:#3F3627;--soft:#6B6052;--muted:#8A7C69;--cream:#F8F3E8;--card:#FFFDF8;--line:#EDE3D1;--sage:#5F7D63;--sage-dark:#2F4A33;--butter-soft:#FBF3D7}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--cream);color:var(--ink);font-family:'NanumSquareRound','Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-text-size-adjust:100%}
a{color:inherit}
.wrap{max-width:520px;margin:0 auto;padding:16px 20px calc(40px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:20px}
.top{display:flex;align-items:center;min-height:52px}
.top img{height:30px;width:auto}
.art{position:relative;align-self:center;width:min(100%,340px);aspect-ratio:1/1;border-radius:24px;overflow:hidden;border:6px solid #fff;box-shadow:0 10px 26px rgba(84,70,48,.14);transform:rotate(-1.5deg)}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.code{position:absolute;right:12px;bottom:12px;background:rgba(255,253,248,.94);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:800;color:#8A5A2B;letter-spacing:.5px}
.text{display:flex;flex-direction:column;gap:8px;text-align:center}
h1{margin:0;font-family:'Gowun Batang',serif;font-size:27px;line-height:1.4}
.lead{margin:0;font-size:15px;line-height:1.75;color:var(--soft)}
.en{margin:0;font-size:12.5px;color:var(--muted)}
.actions{display:flex;flex-direction:column;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:14px;font-weight:800;font-size:15px;text-decoration:none}
.btn.primary{background:var(--sage);color:#fff}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--soft)}
.btn:focus-visible{outline:3px solid var(--sage);outline-offset:2px}
.help{display:flex;flex-direction:column;gap:6px;align-items:center;padding:16px;border-radius:18px;background:var(--butter-soft);text-align:center}
.help a{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;background:#FEE500;color:#3c1e1e;font-weight:700;font-size:14px;text-decoration:none}
.help p{margin:0;font-size:12.5px;line-height:1.6;color:var(--soft)}
</style>
</head>
<body>
<main class="wrap">
  <header class="top"><a href="/" aria-label="DayO 홈"><img src="/images/logo_header.png" alt="DayO"></a></header>
  <div class="art"><img src="/images/talk-cut/street.webp" alt="길 위에서 손을 흔들며 반겨 주는 DayO 친구 Ava"><span class="code">404</span></div>
  <div class="text">
    <h1>앗, 길을 잃었어요</h1>
    <p class="lead">찾으시는 페이지가 없거나 주소가 바뀌었어요.<br>괜찮아요, 대화는 언제든 다시 시작할 수 있으니까요.</p>
    <p class="en" lang="en">We couldn’t find that page. Let’s head back home.</p>
  </div>
  <nav class="actions" aria-label="다른 페이지로 가기">
    <a class="btn primary" href="/">DayO 홈으로 가기</a>
    <a class="btn ghost" href="/faq">자주 묻는 질문 보기</a>
  </nav>
  <section class="help" aria-label="문의">
    <a href="https://pf.kakao.com/_hpxkJX/chat" target="_blank" rel="noopener noreferrer">카카오톡으로 문의하기</a>
    <p>문의 답변: 평일 10~19시 (공휴일 제외)<br><span style="white-space:nowrap">24시간 안에 답변드려요</span></p>
  </section>
</main>
</body>
</html>
