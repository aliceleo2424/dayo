<!DOCTYPE html>
<html lang="ko" data-password-recovery>
<head>
  <link rel="icon" type="image/png" href="/images/logo-square.png">
  <link rel="apple-touch-icon" href="/images/logo-square.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>비밀번호 재설정 | DayO</title>
  <link rel="stylesheet" href="legal-pages.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-env.js"></script>
  <script src="supabase-client.js?v=20260930-password-recovery"></script>
  <script src="password-account.js?v=20260930-password-recovery"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #F8F0E3; color: #40362F; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Malgun Gothic", sans-serif; }
    .reset-shell { width: min(100%, 430px); }
    .reset-brand { display: flex; justify-content: center; margin-bottom: 18px; }
    .reset-brand img { width: auto; height: 52px; object-fit: contain; }
    .reset-card { padding: 28px; border: 1px solid #E7DDD0; border-radius: 18px; background: #FFFBF4; box-shadow: 0 16px 42px rgba(64,54,47,.12); }
    .reset-card h1 { margin: 0 0 8px; font-size: 23px; }
    .reset-card__desc { margin: 0 0 18px; color: #746B66; font-size: 14px; line-height: 1.6; }
    .reset-message { min-height: 22px; margin: 0 0 14px; color: #746B66; font-size: 13px; line-height: 1.5; }
    .reset-message.is-error { color: #C74432; }
    .reset-links { display: flex; flex-wrap: wrap; gap: 10px 16px; margin-top: 18px; }
    .reset-links a { color: #506B55; font-size: 13px; font-weight: 700; text-underline-offset: 3px; }
    #dayoRecoveryHome[hidden], #dayoRecoveryForm[hidden] { display: none; }
    @media (max-width: 480px) { body { padding: 16px; } .reset-card { padding: 22px 19px; border-radius: 20px; } }
  </style>
  <link rel="stylesheet" href="/english-typography.css?v=20261005-en">
  <script src="/english-typography-locale.js?v=20261005-en" defer></script>
  <link rel="stylesheet" href="/brand-surfaces.css?v=20261005-logo-palette">
</head>
<body>
  <main class="reset-shell">
    <a class="reset-brand" href="/" aria-label="DayO 홈으로"><img src="/images/logo_header.png" alt="DayO"></a>
    <section class="reset-card" aria-labelledby="dayoRecoveryTitle">
      <h1 id="dayoRecoveryTitle" data-dp-text="resetPageTitle">새 비밀번호 설정</h1>
      <p class="reset-card__desc" data-dp-text="resetPageDesc">새로 사용할 비밀번호를 입력해 주세요.</p>
      <p class="reset-message dayo-password-status" id="dayoRecoveryMessage" role="status" aria-live="polite">재설정 링크를 확인하고 있어요.</p>
      <form class="dayo-password-form" id="dayoRecoveryForm" hidden>
        <label for="dayoRecoveryPassword" data-dp-text="newPassword">새 비밀번호</label>
        <input class="dayo-password-input" id="dayoRecoveryPassword" type="password" minlength="6" autocomplete="new-password" required data-dp-placeholder="newPassword">
        <label for="dayoRecoveryConfirm" data-dp-text="confirmPassword">새 비밀번호 확인</label>
        <input class="dayo-password-input" id="dayoRecoveryConfirm" type="password" minlength="6" autocomplete="new-password" required data-dp-placeholder="confirmPassword">
        <p class="dayo-password-hint" data-dp-text="passwordHint">비밀번호는 6자 이상 입력해 주세요.</p>
        <p class="dayo-password-status" role="status" aria-live="polite"></p>
        <div class="dayo-password-actions">
          <button class="dayo-password-primary" type="submit" data-dp-text="save">변경하기</button>
        </div>
      </form>
      <div class="reset-links">
        <a href="/?forgotPassword=1" data-dp-text="requestAgain">재설정 메일 다시 요청하기</a>
        <a href="/" id="dayoRecoveryHome" data-dp-text="home" hidden>DayO 홈으로 돌아가기</a>
      </div>
    </section>
  </main>
</body>
</html>
