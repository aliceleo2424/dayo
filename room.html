<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DayO 돼요 — 화상 회화 스튜디오</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --pink: #FFD1DC;
      --peach: #FFE5B4;
      --yellow: #FFF9C4;
      --cream: #FFF8F5;
      --coral: #FF6B57;
      --coral-dark: #E55A45;
      --coral-pale: #FFE8E3;
      --bg-card: #FFFCFA;
      --text: #5C4A42;
      --text-muted: #9A8580;
      --shadow: rgba(255, 107, 87, 0.16);
      --shadow-warm: rgba(92, 74, 66, 0.08);
      --radius: 20px;
      --radius-lg: 28px;
    }

    html, body {
      height: 100%;
      font-family: 'Gowun Dodum', 'Quicksand', -apple-system, sans-serif;
      background: var(--cream);
      color: var(--text);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .studio {
      height: 100%;
      display: grid;
      grid-template-rows: auto 1fr auto;
      background:
        radial-gradient(circle at 12% 18%, rgba(255, 209, 220, 0.55), transparent 42%),
        radial-gradient(circle at 88% 12%, rgba(255, 229, 180, 0.5), transparent 40%),
        radial-gradient(circle at 70% 88%, rgba(255, 249, 196, 0.45), transparent 45%),
        var(--cream);
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.85rem 1.25rem;
      background: rgba(255, 252, 250, 0.88);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255, 209, 220, 0.4);
      z-index: 20;
    }

    .top-left, .top-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .timer {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.9rem;
      background: var(--coral-pale);
      color: var(--coral);
      border-radius: 999px;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      min-width: 5.5rem;
      justify-content: center;
    }

    .tutor-chip {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.35rem 0.85rem 0.35rem 0.35rem;
      background: var(--bg-card);
      border: 1px solid var(--coral-pale);
      border-radius: 999px;
      box-shadow: 0 3px 12px var(--shadow-warm);
    }

    .tutor-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--pink), var(--peach));
      display: flex; align-items: center; justify-content: center;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700; font-size: 0.85rem; color: var(--coral);
    }

    .tutor-meta { text-align: left; }
    .tutor-name { font-size: 0.88rem; font-weight: 700; line-height: 1.2; }
    .tutor-status { font-size: 0.72rem; color: var(--text-muted); }
    .tutor-status::before {
      content: '';
      display: inline-block;
      width: 6px; height: 6px;
      margin-right: 0.35rem;
      border-radius: 50%;
      background: #6BCB77;
      vertical-align: middle;
    }

    .top-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.55rem 1rem;
      border: 1px solid var(--coral-pale);
      border-radius: 999px;
      background: var(--bg-card);
      color: var(--text);
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
    }

    .top-btn:hover {
      background: var(--coral-pale);
      transform: translateY(-1px);
    }

    .top-btn--end {
      background: var(--coral);
      border-color: var(--coral);
      color: #fff;
      box-shadow: 0 4px 14px var(--shadow);
    }

    .top-btn--end:hover {
      background: var(--coral-dark);
      border-color: var(--coral-dark);
    }

    /* Main Stage */
    .main-stage {
      position: relative;
      min-height: 0;
      padding: 1rem 1.25rem;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1rem;
    }

    .video-stage {
      position: relative;
      min-height: 0;
      border-radius: var(--radius-lg);
      overflow: hidden;
      background: linear-gradient(160deg, #F7D6DE 0%, #FFE2C8 50%, #FFF1C9 100%);
      box-shadow: 0 12px 36px var(--shadow-warm);
      border: 1px solid rgba(255, 209, 220, 0.5);
    }

    .tutor-video {
      width: 100%;
      height: 100%;
      min-height: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      background:
        radial-gradient(circle at 50% 35%, rgba(255,255,255,0.45), transparent 55%),
        linear-gradient(160deg, #F7D6DE, #FFE2C8 55%, #FFF1C9);
    }

    .tutor-video video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .tutor-video.has-stream video { display: block; }
    .tutor-video.has-stream .tutor-placeholder { display: none; }

    .tutor-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      z-index: 1;
    }

    .tutor-placeholder-avatar {
      width: 120px; height: 120px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 4px solid rgba(255,255,255,0.85);
      display: flex; align-items: center; justify-content: center;
      font-family: 'Quicksand', sans-serif;
      font-size: 2.5rem; font-weight: 700; color: var(--coral);
      box-shadow: 0 10px 28px var(--shadow-warm);
    }

    .tutor-placeholder-name {
      font-size: 1.15rem; font-weight: 700;
    }

    .tutor-placeholder-sub {
      font-size: 0.9rem; color: var(--text-muted);
    }

    /* PiP self video */
    .self-pip {
      position: absolute;
      right: 1.1rem;
      bottom: 1.1rem;
      width: min(180px, 32vw);
      aspect-ratio: 4 / 3;
      border-radius: 18px;
      overflow: hidden;
      background: linear-gradient(145deg, var(--peach), var(--pink));
      border: 3px solid rgba(255,255,255,0.9);
      box-shadow: 0 10px 28px var(--shadow);
      z-index: 5;
    }

    .self-pip video {
      width: 100%; height: 100%;
      object-fit: cover;
      display: none;
      transform: scaleX(-1);
    }

    .self-pip.has-stream video { display: block; }
    .self-pip.has-stream .self-placeholder { display: none; }

    .self-placeholder {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 0.35rem;
      color: var(--text);
      font-size: 0.8rem; font-weight: 600;
    }

    .self-placeholder-icon {
      width: 42px; height: 42px;
      border-radius: 50%;
      background: rgba(255,255,255,0.75);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
    }

    .pip-label {
      position: absolute;
      left: 0.5rem; top: 0.45rem;
      padding: 0.2rem 0.5rem;
      background: rgba(92, 74, 66, 0.45);
      color: #fff;
      border-radius: 999px;
      font-size: 0.68rem;
      font-weight: 600;
      z-index: 2;
    }

    /* Chat Panel */
    .chat-panel {
      width: 300px;
      display: flex;
      flex-direction: column;
      background: var(--bg-card);
      border: 1px solid var(--coral-pale);
      border-radius: var(--radius-lg);
      box-shadow: 0 10px 32px var(--shadow-warm);
      overflow: hidden;
      transition: width 0.3s ease, opacity 0.3s ease, margin 0.3s ease;
    }

    .chat-panel.collapsed {
      width: 0;
      opacity: 0;
      margin: 0;
      border: none;
      pointer-events: none;
    }

    .chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 1rem;
      background: linear-gradient(135deg, var(--pink), var(--peach));
      font-weight: 700;
      font-size: 0.92rem;
    }

    .chat-close {
      width: 28px; height: 28px;
      border: none; border-radius: 50%;
      background: rgba(255,255,255,0.55);
      color: var(--coral);
      cursor: pointer;
      font-size: 0.9rem;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      min-height: 200px;
      max-height: calc(100vh - 280px);
    }

    .bubble {
      max-width: 88%;
      padding: 0.7rem 0.9rem;
      border-radius: 16px;
      font-size: 0.88rem;
      line-height: 1.55;
    }

    .bubble--tutor {
      align-self: flex-start;
      background: var(--coral-pale);
      border-bottom-left-radius: 4px;
    }

    .bubble--me {
      align-self: flex-end;
      background: var(--coral);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .chat-input-row {
      display: flex;
      gap: 0.45rem;
      padding: 0.85rem;
      border-top: 1px solid var(--coral-pale);
    }

    .chat-input {
      flex: 1;
      border: 1px solid var(--coral-pale);
      border-radius: 14px;
      padding: 0.7rem 0.85rem;
      font-family: inherit;
      font-size: 0.88rem;
      background: var(--cream);
      outline: none;
    }

    .chat-input:focus {
      border-color: var(--coral);
      box-shadow: 0 0 0 3px rgba(255, 107, 87, 0.12);
    }

    .chat-send {
      border: none;
      border-radius: 14px;
      padding: 0 0.95rem;
      background: var(--coral);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    /* Bottom Bar */
    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      padding: 1rem 1.25rem 1.25rem;
      background: rgba(255, 252, 250, 0.9);
      backdrop-filter: blur(14px);
      border-top: 1px solid rgba(255, 209, 220, 0.4);
      z-index: 20;
    }

    .ctrl-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.8rem 1.15rem;
      border: 1px solid var(--coral-pale);
      border-radius: 999px;
      background: var(--bg-card);
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, background 0.2s, box-shadow 0.2s, opacity 0.2s;
      box-shadow: 0 3px 12px var(--shadow-warm);
    }

    .ctrl-btn:hover {
      transform: translateY(-2px);
      background: var(--coral-pale);
    }

    .ctrl-btn.off {
      opacity: 0.55;
      background: #F3EDEB;
      text-decoration: line-through;
    }

    .ctrl-btn--ai {
      background: var(--coral);
      border-color: var(--coral);
      color: #fff;
      box-shadow: 0 5px 0 var(--coral-dark), 0 8px 22px var(--shadow);
    }

    .ctrl-btn--ai:hover {
      background: #FF7A68;
      box-shadow: 0 6px 0 var(--coral-dark), 0 12px 28px rgba(255,107,87,0.28);
    }

    .ctrl-btn--ai:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--coral-dark), 0 4px 12px var(--shadow);
    }

    .ctrl-divider {
      width: 1px;
      height: 28px;
      background: rgba(255, 209, 220, 0.7);
      margin: 0 0.25rem;
    }

    /* Sentence overlay */
    .sentence-overlay {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) scale(0.95);
      z-index: 15;
      max-width: min(560px, 88%);
      padding: 1.5rem 1.75rem;
      background: rgba(255, 252, 250, 0.95);
      border: 2px solid var(--coral-pale);
      border-radius: var(--radius-lg);
      box-shadow: 0 20px 48px var(--shadow);
      text-align: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s, transform 0.3s, visibility 0.3s;
    }

    .sentence-overlay.show {
      opacity: 1;
      visibility: visible;
      transform: translate(-50%, -50%) scale(1);
    }

    .sentence-overlay-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--coral);
      margin-bottom: 0.65rem;
      letter-spacing: 0.04em;
    }

    .sentence-overlay-text {
      font-family: 'Quicksand', 'Gowun Dodum', sans-serif;
      font-size: clamp(1.25rem, 3.5vw, 1.75rem);
      font-weight: 700;
      line-height: 1.45;
      color: var(--text);
    }

    .sentence-overlay-close {
      margin-top: 1rem;
      border: none;
      background: var(--coral-pale);
      color: var(--coral);
      padding: 0.45rem 1rem;
      border-radius: 999px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    /* Modals */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(255, 248, 245, 0.72);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      width: min(480px, 100%);
      background: var(--bg-card);
      border: 1px solid var(--coral-pale);
      border-radius: var(--radius-lg);
      padding: 1.75rem 1.5rem;
      box-shadow: 0 24px 56px var(--shadow);
      transform: translateY(12px) scale(0.96);
      transition: transform 0.35s cubic-bezier(0.34, 1.4, 0.64, 1);
      position: relative;
    }

    .modal-overlay.active .modal {
      transform: translateY(0) scale(1);
    }

    .modal-close {
      position: absolute;
      top: 1rem; right: 1rem;
      width: 34px; height: 34px;
      border: none; border-radius: 50%;
      background: var(--coral-pale);
      color: var(--coral);
      cursor: pointer;
      font-size: 1rem;
    }

    .modal-badge {
      display: inline-block;
      padding: 0.3rem 0.75rem;
      background: var(--coral-pale);
      color: var(--coral);
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      line-height: 1.4;
      padding-right: 2rem;
    }

    .modal-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 1.15rem;
    }

    .modal-input {
      width: 100%;
      min-height: 88px;
      padding: 0.95rem 1rem;
      border: 1px solid var(--coral-pale);
      border-radius: var(--radius);
      background: var(--cream);
      font-family: inherit;
      font-size: 0.95rem;
      resize: vertical;
      outline: none;
      margin-bottom: 0.85rem;
    }

    .modal-input:focus {
      border-color: var(--coral);
      box-shadow: 0 0 0 3px rgba(255, 107, 87, 0.12);
    }

    .modal-submit {
      width: 100%;
      padding: 0.95rem;
      border: none;
      border-radius: var(--radius);
      background: var(--coral);
      color: #fff;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--coral-dark);
      transition: transform 0.15s, box-shadow 0.15s;
    }

    .modal-submit:hover { transform: translateY(-1px); }
    .modal-submit:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--coral-dark);
    }

    .word-cards {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      margin-top: 1rem;
    }

    .word-card {
      padding: 0.95rem 1.1rem;
      background: var(--cream);
      border: 1.5px solid var(--coral-pale);
      border-radius: var(--radius);
      text-align: left;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.2s;
    }

    .word-card:hover {
      background: var(--coral-pale);
      border-color: var(--coral);
      transform: translateY(-2px);
    }

    .word-card-num {
      font-family: 'Quicksand', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--coral);
      margin-bottom: 0.25rem;
    }

    .word-card-text {
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.4;
    }

    .toast {
      position: fixed;
      bottom: 6.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      z-index: 120;
      padding: 0.85rem 1.35rem;
      background: var(--bg-card);
      border: 1px solid var(--coral-pale);
      border-radius: 16px;
      box-shadow: 0 10px 28px var(--shadow);
      font-weight: 600;
      font-size: 0.9rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 860px) {
      .main-stage {
        grid-template-columns: 1fr;
      }

      .chat-panel {
        position: absolute;
        right: 1rem;
        top: 1rem;
        bottom: 1rem;
        width: min(300px, calc(100% - 2rem));
        z-index: 12;
      }

      .chat-panel.collapsed {
        width: 0;
      }

      .top-bar {
        flex-wrap: wrap;
      }

      .ctrl-btn span.label {
        display: none;
      }

      .ctrl-btn {
        padding: 0.85rem 1rem;
      }

      .ctrl-divider { display: none; }
    }
  </style>
</head>
<body>
  <div class="studio">
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="top-left">
        <div class="timer" id="timer" aria-live="polite">⏱️ 19:50</div>
        <div class="tutor-chip">
          <div class="tutor-avatar">C</div>
          <div class="tutor-meta">
            <div class="tutor-name">Camille</div>
            <div class="tutor-status">Live · French Tutor</div>
          </div>
        </div>
      </div>
      <div class="top-right">
        <button class="top-btn" id="shareBtn" type="button">🖥️ 화면 공유</button>
        <button class="top-btn top-btn--end" id="endBtn" type="button">🚪 수업 종료</button>
      </div>
    </header>

    <!-- Main -->
    <main class="main-stage">
      <div class="video-stage">
        <div class="tutor-video" id="tutorVideoBox">
          <video id="tutorVideo" playsinline muted></video>
          <div class="tutor-placeholder">
            <div class="tutor-placeholder-avatar">C</div>
            <div class="tutor-placeholder-name">Camille</div>
            <div class="tutor-placeholder-sub">원어민 튜터와 대화 중</div>
          </div>
        </div>

        <div class="self-pip" id="selfPip">
          <span class="pip-label">나</span>
          <video id="selfVideo" playsinline muted autoplay></video>
          <div class="self-placeholder">
            <div class="self-placeholder-icon">👤</div>
            <span>내 화면</span>
          </div>
        </div>

        <div class="sentence-overlay" id="sentenceOverlay">
          <div class="sentence-overlay-label">📝 이렇게 말해 보세요</div>
          <div class="sentence-overlay-text" id="sentenceOverlayText"></div>
          <button class="sentence-overlay-close" id="sentenceOverlayClose" type="button">닫기</button>
        </div>
      </div>

      <aside class="chat-panel collapsed" id="chatPanel" aria-label="라이브 채팅">
        <div class="chat-header">
          <span>💬 라이브 채팅</span>
          <button class="chat-close" id="chatClose" type="button" aria-label="채팅 닫기">✕</button>
        </div>
        <div class="chat-messages" id="chatMessages">
          <div class="bubble bubble--tutor">Bonjour! Ready to practice today? ☕</div>
          <div class="bubble bubble--me">Hi Camille! Let's start 🍰</div>
        </div>
        <form class="chat-input-row" id="chatForm">
          <input class="chat-input" id="chatInput" type="text" placeholder="메시지를 입력하세요" autocomplete="off">
          <button class="chat-send" type="submit">전송</button>
        </form>
      </aside>
    </main>

    <!-- Bottom Controls -->
    <footer class="bottom-bar">
      <button class="ctrl-btn" id="micBtn" type="button" aria-pressed="true">🎤 <span class="label">마이크 켜짐</span></button>
      <button class="ctrl-btn" id="camBtn" type="button" aria-pressed="true">📹 <span class="label">카메라 켜짐</span></button>
      <button class="ctrl-btn" id="chatToggle" type="button">💬 <span class="label">채팅</span></button>
      <div class="ctrl-divider" aria-hidden="true"></div>
      <button class="ctrl-btn ctrl-btn--ai" id="wordHelpBtn" type="button">💡 <span class="label">단어도움</span></button>
      <button class="ctrl-btn ctrl-btn--ai" id="sentenceHelpBtn" type="button">📝 <span class="label">문장도움</span></button>
    </footer>
  </div>

  <!-- Word Help Modal -->
  <div class="modal-overlay" id="wordModal">
    <div class="modal" role="dialog" aria-labelledby="wordModalTitle" aria-modal="true">
      <button class="modal-close" data-close="wordModal" aria-label="닫기">✕</button>
      <div class="modal-badge">💡 단어도움</div>
      <h2 class="modal-title" id="wordModalTitle">막히는 한국어 단어나 상황을 입력해 보세요</h2>
      <p class="modal-desc">예: 주문할 때 아메리카노 따뜻한 거</p>
      <textarea class="modal-input" id="wordInput" placeholder="한국어로 편하게 적어 주세요"></textarea>
      <button class="modal-submit" id="wordSubmit" type="button">추천받기</button>
      <div class="word-cards" id="wordCards" hidden></div>
    </div>
  </div>

  <!-- Sentence Help Modal -->
  <div class="modal-overlay" id="sentenceModal">
    <div class="modal" role="dialog" aria-labelledby="sentenceModalTitle" aria-modal="true">
      <button class="modal-close" data-close="sentenceModal" aria-label="닫기">✕</button>
      <div class="modal-badge">📝 문장도움</div>
      <h2 class="modal-title" id="sentenceModalTitle">하고 싶은 말을 모국어로 편하게 써보세요</h2>
      <p class="modal-desc">AI가 튜터에게 바로 말할 수 있는 자연스러운 문장으로 바꿔 줄게요.</p>
      <textarea class="modal-input" id="sentenceInput" placeholder="예: 오늘 날씨가 좋아서 기분이 좋아요요"></textarea>
      <button class="modal-submit" id="sentenceSubmit" type="button">문장 변환</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    /* Timer 19:50 countdown */
    (function initTimer() {
      const el = document.getElementById('timer');
      let remaining = 19 * 60 + 50;

      function render() {
        const m = Math.floor(remaining / 60);
        const s = remaining % 60;
        el.textContent = `⏱️ ${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }

      render();
      setInterval(() => {
        if (remaining > 0) {
          remaining -= 1;
          render();
        }
      }, 1000);
    })();

    /* Toast */
    const toast = document.getElementById('toast');
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2400);
    }

    /* Media controls */
    let localStream = null;
    let micOn = true;
    let camOn = true;

    const selfVideo = document.getElementById('selfVideo');
    const selfPip = document.getElementById('selfPip');
    const micBtn = document.getElementById('micBtn');
    const camBtn = document.getElementById('camBtn');

    async function initMedia() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        selfVideo.srcObject = localStream;
        selfPip.classList.add('has-stream');
      } catch (_) {
        showToast('카메라/마이크 권한이 없어도 연습은 가능해요 ☕');
      }
    }

    initMedia();

    micBtn.addEventListener('click', () => {
      micOn = !micOn;
      if (localStream) {
        localStream.getAudioTracks().forEach((t) => { t.enabled = micOn; });
      }
      micBtn.classList.toggle('off', !micOn);
      micBtn.setAttribute('aria-pressed', String(micOn));
      micBtn.innerHTML = micOn
        ? '🎤 <span class="label">마이크 켜짐</span>'
        : '🎤 <span class="label">마이크 꺼짐</span>';
    });

    camBtn.addEventListener('click', () => {
      camOn = !camOn;
      if (localStream) {
        localStream.getVideoTracks().forEach((t) => { t.enabled = camOn; });
      }
      camBtn.classList.toggle('off', !camOn);
      camBtn.setAttribute('aria-pressed', String(camOn));
      camBtn.innerHTML = camOn
        ? '📹 <span class="label">카메라 켜짐</span>'
        : '📹 <span class="label">카메라 꺼짐</span>';
      if (!camOn) selfPip.classList.remove('has-stream');
      else if (localStream) selfPip.classList.add('has-stream');
    });

    document.getElementById('shareBtn').addEventListener('click', async () => {
      try {
        const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
        showToast('화면 공유를 시작했어요 🖥️');
        stream.getVideoTracks()[0].addEventListener('ended', () => {
          showToast('화면 공유가 종료됐어요');
        });
      } catch (_) {
        showToast('화면 공유가 취소되었어요');
      }
    });

    document.getElementById('endBtn').addEventListener('click', () => {
      if (localStream) {
        localStream.getTracks().forEach((t) => t.stop());
      }
      window.location.href = 'index.html';
    });

    /* Chat panel */
    const chatPanel = document.getElementById('chatPanel');
    const chatToggle = document.getElementById('chatToggle');
    const chatClose = document.getElementById('chatClose');
    const chatForm = document.getElementById('chatForm');
    const chatInput = document.getElementById('chatInput');
    const chatMessages = document.getElementById('chatMessages');

    function openChat() { chatPanel.classList.remove('collapsed'); }
    function closeChat() { chatPanel.classList.add('collapsed'); }

    chatToggle.addEventListener('click', () => {
      chatPanel.classList.contains('collapsed') ? openChat() : closeChat();
    });
    chatClose.addEventListener('click', closeChat);

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = chatInput.value.trim();
      if (!text) return;
      const bubble = document.createElement('div');
      bubble.className = 'bubble bubble--me';
      bubble.textContent = text;
      chatMessages.appendChild(bubble);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      chatInput.value = '';

      setTimeout(() => {
        const reply = document.createElement('div');
        reply.className = 'bubble bubble--tutor';
        reply.textContent = 'Nice! Tell me more ☕';
        chatMessages.appendChild(reply);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }, 700);
    });

    /* Modal helpers */
    function openModal(id) {
      document.getElementById(id).classList.add('active');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    document.querySelectorAll('[data-close]').forEach((btn) => {
      btn.addEventListener('click', () => closeModal(btn.dataset.close));
    });

    document.querySelectorAll('.modal-overlay').forEach((overlay) => {
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) overlay.classList.remove('active');
      });
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        document.querySelectorAll('.modal-overlay.active').forEach((m) => m.classList.remove('active'));
        document.getElementById('sentenceOverlay').classList.remove('show');
      }
    });

    /* Word Help */
    const wordHelpBtn = document.getElementById('wordHelpBtn');
    const wordInput = document.getElementById('wordInput');
    const wordSubmit = document.getElementById('wordSubmit');
    const wordCards = document.getElementById('wordCards');

    const wordPresets = {
      default: [
        'Hot Americano, please.',
        'A warm Americano for here.',
        'Can I get a hot Americano?'
      ],
      아메리카노: [
        'Hot Americano, please.',
        'A warm Americano for here.',
        'Can I get a hot Americano?'
      ],
      날씨: [
        "It's such a nice day today.",
        'The weather feels perfect.',
        "I'm loving this sunny weather."
      ],
      감사: [
        'Thank you so much!',
        'I really appreciate it.',
        "That's so kind of you."
      ],
      소개: [
        "Nice to meet you! I'm Alice.",
        "Hi, I'm Alice. Nice to meet you.",
        'Pleasure to meet you!'
      ]
    };

    function getWordSuggestions(input) {
      const text = input.toLowerCase();
      for (const key of Object.keys(wordPresets)) {
        if (key !== 'default' && text.includes(key)) return wordPresets[key];
      }
      if (text.includes('주문') || text.includes('커피') || text.includes('따뜻한')) {
        return wordPresets.아메리카노;
      }
      return wordPresets.default;
    }

    wordHelpBtn.addEventListener('click', () => {
      wordCards.hidden = true;
      wordCards.innerHTML = '';
      wordInput.value = '';
      openModal('wordModal');
      setTimeout(() => wordInput.focus(), 200);
    });

    wordSubmit.addEventListener('click', () => {
      const value = wordInput.value.trim();
      if (!value) {
        wordInput.focus();
        return;
      }
      const suggestions = getWordSuggestions(value);
      wordCards.innerHTML = suggestions.map((s, i) => `
        <button class="word-card" type="button" data-phrase="${s.replace(/"/g, '&quot;')}">
          <div class="word-card-num">${i + 1}</div>
          <div class="word-card-text">${s}</div>
        </button>
      `).join('');
      wordCards.hidden = false;

      wordCards.querySelectorAll('.word-card').forEach((card) => {
        card.addEventListener('click', () => {
          navigator.clipboard?.writeText(card.dataset.phrase).catch(() => {});
          showToast(`"${card.dataset.phrase}" 복사했어요 💡`);
          closeModal('wordModal');
        });
      });
    });

    /* Sentence Help */
    const sentenceHelpBtn = document.getElementById('sentenceHelpBtn');
    const sentenceInput = document.getElementById('sentenceInput');
    const sentenceSubmit = document.getElementById('sentenceSubmit');
    const sentenceOverlay = document.getElementById('sentenceOverlay');
    const sentenceOverlayText = document.getElementById('sentenceOverlayText');
    const sentenceOverlayClose = document.getElementById('sentenceOverlayClose');

    const sentenceMap = [
      { keys: ['날씨', '기분'], en: "The weather is so nice today that I'm in a great mood." },
      { keys: ['아메리카노', '따뜻한'], en: "I'd like a hot Americano, please." },
      { keys: ['만나서', '반가'], en: "It's so nice to meet you!" },
      { keys: ['천천히', '말해'], en: 'Could you please speak a little more slowly?' },
      { keys: ['다시', '한 번'], en: 'Could you say that one more time, please?' },
      { keys: ['이해', '못'], en: "Sorry, I didn't quite catch that." },
      { keys: ['도와'], en: 'Could you help me with this, please?' }
    ];

    function convertSentence(input) {
      for (const item of sentenceMap) {
        if (item.keys.every((k) => input.includes(k)) || item.keys.some((k) => input.includes(k) && input.length < 18)) {
          return item.en;
        }
      }
      return "I'd love to share that with you — could we talk about it together?";
    }

    sentenceHelpBtn.addEventListener('click', () => {
      sentenceInput.value = '';
      openModal('sentenceModal');
      setTimeout(() => sentenceInput.focus(), 200);
    });

    sentenceSubmit.addEventListener('click', () => {
      const value = sentenceInput.value.trim();
      if (!value) {
        sentenceInput.focus();
        return;
      }
      const converted = convertSentence(value);
      sentenceOverlayText.textContent = converted;
      closeModal('sentenceModal');
      sentenceOverlay.classList.add('show');
    });

    sentenceOverlayClose.addEventListener('click', () => {
      sentenceOverlay.classList.remove('show');
    });
  </script>
</body>
</html>
