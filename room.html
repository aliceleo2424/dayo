<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DayO 돼요 — 화상 회화 스튜디오</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --pink: #FFD1DC; --peach: #FFE5B4; --yellow: #FFF9C4;
      --cream: #FFF8F5; --coral: #FF6B57; --text: #5C4A42; --muted: #9A8580;
    }
    body {
      font-family: 'Gowun Dodum', 'Quicksand', sans-serif;
      min-height: 100vh;
      background: linear-gradient(160deg, var(--pink), var(--peach) 45%, var(--yellow));
      color: var(--text);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 2rem 1.5rem; text-align: center;
    }
    .card {
      background: rgba(255,252,250,0.92);
      border-radius: 28px;
      padding: 2.5rem 2rem;
      max-width: 440px; width: 100%;
      box-shadow: 0 16px 48px rgba(255,107,87,0.15);
    }
    .badge {
      display: inline-block; margin-bottom: 1rem;
      padding: 0.35rem 0.9rem; border-radius: 999px;
      background: #FFE8E3; color: var(--coral); font-size: 0.8rem; font-weight: 700;
    }
    h1 { font-family: 'Quicksand', sans-serif; font-size: 1.75rem; margin-bottom: 0.75rem; }
    h1 span { color: var(--coral); }
    p { color: var(--muted); line-height: 1.7; margin-bottom: 1.75rem; }
    .actions { display: flex; flex-direction: column; gap: 0.75rem; }
    a.btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 0.95rem 1.5rem; border-radius: 999px; text-decoration: none;
      font-weight: 700; transition: transform 0.2s, box-shadow 0.2s;
    }
    a.btn-primary { background: var(--coral); color: #fff; box-shadow: 0 6px 20px rgba(255,107,87,0.25); }
    a.btn-primary:hover { transform: translateY(-2px); }
    a.btn-ghost { background: #fff; color: var(--coral); border: 1px solid #FFE8E3; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">🎙️ Live Room</div>
    <h1>DayO <span>돼요</span> 스튜디오</h1>
    <p>원어민과 눈 맞추며 대화하는 화상 회화 룸입니다.<br>곧 라이브 세션이 시작돼요.</p>
    <div class="actions">
      <a class="btn btn-primary" href="index.html">← 랜딩으로 돌아가기</a>
    </div>
  </div>
</body>
</html>
