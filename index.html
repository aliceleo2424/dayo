<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DayO (돼요) — AI 회화 코파일럿</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #F7F5F0;
      --bg-card: #FFFCF8;
      --lavender: #9A86A4;
      --lavender-light: #B8A9C4;
      --lavender-pale: #EDE8F0;
      --sage: #879A80;
      --sage-light: #A8B8A6;
      --sage-pale: #E4EBE2;
      --text: #4A4440;
      --text-muted: #8A8279;
      --text-soft: #A69B93;
      --shadow-lavender: rgba(154, 134, 164, 0.18);
      --shadow-sage: rgba(135, 154, 128, 0.2);
      --shadow-warm: rgba(74, 68, 64, 0.06);
      --radius-sm: 16px;
      --radius-md: 24px;
      --radius-lg: 32px;
      --radius-xl: 40px;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Gowun Dodum', 'Quicksand', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    /* Background blobs */
    .bg-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.45;
      pointer-events: none;
      z-index: 0;
    }

    .bg-blob--sage {
      width: 440px;
      height: 440px;
      background: var(--sage-pale);
      top: -100px;
      right: -100px;
      animation: float 9s ease-in-out infinite;
    }

    .bg-blob--lavender {
      width: 400px;
      height: 400px;
      background: var(--lavender-pale);
      bottom: -80px;
      left: -80px;
      animation: float 11s ease-in-out infinite reverse;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(16px, -24px) scale(1.04); }
    }

    /* Header */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      background: rgba(247, 245, 240, 0.82);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(154, 134, 164, 0.1);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      text-decoration: none;
      color: var(--text);
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(145deg, var(--lavender-light), var(--lavender));
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Quicksand', sans-serif;
      font-size: 1.35rem;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 6px 20px var(--shadow-lavender);
      transform: rotate(-3deg);
    }

    .logo-text {
      font-family: 'Quicksand', 'Gowun Dodum', sans-serif;
      font-size: 1.45rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .logo-text span {
      color: var(--lavender);
      font-weight: 600;
    }

    .insta-link {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.6rem 1.2rem;
      background: var(--bg-card);
      border: 1.5px solid var(--lavender-pale);
      border-radius: 999px;
      text-decoration: none;
      color: var(--lavender);
      font-family: 'Quicksand', sans-serif;
      font-weight: 600;
      font-size: 0.92rem;
      transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
      box-shadow: 0 4px 16px var(--shadow-lavender);
    }

    .insta-link:hover {
      transform: translateY(-2px);
      background: var(--lavender-pale);
      box-shadow: 0 8px 24px var(--shadow-lavender);
    }

    .insta-link svg {
      width: 17px;
      height: 17px;
      fill: currentColor;
    }

    /* Hero */
    main {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6rem 1.5rem 3rem;
      text-align: center;
    }

    .hero-title {
      font-family: 'Quicksand', 'Gowun Dodum', sans-serif;
      font-size: clamp(2.1rem, 5.5vw, 3.5rem);
      font-weight: 700;
      line-height: 1.25;
      margin-bottom: 1rem;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .title-rotator-wrap {
      display: inline-block;
      min-width: 12.5em;
      text-align: center;
      vertical-align: bottom;
    }

    .title-rotator {
      display: inline-block;
      transition: opacity 0.55s ease;
      white-space: nowrap;
    }

    .title-rotator.fade-out {
      opacity: 0;
    }

    .hero-title em {
      font-style: normal;
      color: var(--lavender);
    }

    .hero-subtitle {
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      color: var(--text-muted);
      font-weight: 500;
      max-width: 460px;
      line-height: 1.75;
      margin-bottom: 2.5rem;
    }

    /* CTA Button */
    .cta-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.55rem;
      padding: 1.2rem 2.4rem;
      font-family: 'Gowun Dodum', 'Quicksand', sans-serif;
      font-size: clamp(1rem, 2.4vw, 1.15rem);
      font-weight: 600;
      color: #fff;
      background: linear-gradient(145deg, var(--sage-light), var(--sage));
      border: none;
      border-radius: var(--radius-xl);
      cursor: pointer;
      box-shadow:
        0 8px 28px var(--shadow-sage),
        0 2px 8px var(--shadow-warm);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
      letter-spacing: 0.01em;
      max-width: 90vw;
    }

    .cta-btn:hover {
      transform: translateY(-3px);
      box-shadow:
        0 14px 36px var(--shadow-sage),
        0 4px 12px var(--shadow-warm);
    }

    .cta-btn:active {
      transform: translateY(-1px);
      box-shadow:
        0 6px 20px var(--shadow-sage),
        0 2px 6px var(--shadow-warm);
    }

    .cta-btn .emoji {
      font-size: 1.25em;
    }

    /* Features strip */
    .features {
      display: flex;
      gap: 1rem;
      margin-top: 3.25rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .feature-chip {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.55rem 1.1rem;
      background: var(--bg-card);
      border: 1.5px solid var(--lavender-pale);
      border-radius: var(--radius-md);
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
      box-shadow: 0 4px 16px var(--shadow-warm);
    }

    /* Modal overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(247, 245, 240, 0.65);
      backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s ease, visibility 0.35s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      position: relative;
      background: var(--bg-card);
      border: 1.5px solid var(--lavender-pale);
      border-radius: var(--radius-lg);
      padding: 2.25rem 1.85rem;
      max-width: 480px;
      width: 100%;
      transform: scale(0.9) translateY(16px);
      transition: transform 0.4s cubic-bezier(0.34, 1.4, 0.64, 1);
      box-shadow:
        0 20px 60px var(--shadow-lavender),
        0 8px 24px var(--shadow-warm);
    }

    .modal-overlay.active .modal {
      transform: scale(1) translateY(0);
    }

    .modal-header {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .modal-step {
      display: inline-block;
      font-family: 'Quicksand', sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--sage);
      background: var(--sage-pale);
      padding: 0.3rem 0.85rem;
      border-radius: 999px;
      margin-bottom: 0.85rem;
      letter-spacing: 0.04em;
    }

    .modal-title {
      font-family: 'Gowun Dodum', sans-serif;
      font-size: 1.45rem;
      font-weight: 600;
      line-height: 1.4;
      color: var(--text);
    }

    .modal-close {
      position: absolute;
      top: 1.25rem;
      right: 1.25rem;
      width: 38px;
      height: 38px;
      background: var(--lavender-pale);
      border: none;
      border-radius: 50%;
      color: var(--lavender);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .modal-close:hover {
      background: var(--lavender-light);
      color: #fff;
      transform: rotate(90deg);
    }

    /* Choice cards */
    .choice-cards {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .choice-card {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.15rem 1.3rem;
      background: var(--bg);
      border: 1.5px solid var(--lavender-pale);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
      text-align: left;
      font-family: inherit;
      color: var(--text);
      width: 100%;
      box-shadow: 0 3px 12px var(--shadow-warm);
    }

    .choice-card:hover {
      transform: translateY(-2px);
      border-color: var(--lavender-light);
      background: var(--lavender-pale);
      box-shadow: 0 8px 24px var(--shadow-lavender);
    }

    .choice-card.selected {
      border-color: var(--sage);
      background: var(--sage-pale);
      box-shadow: 0 8px 28px var(--shadow-sage);
    }

    .choice-number {
      flex-shrink: 0;
      width: 38px;
      height: 38px;
      background: linear-gradient(145deg, var(--lavender-light), var(--lavender));
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Quicksand', sans-serif;
      font-weight: 700;
      font-size: 0.95rem;
      color: #fff;
      box-shadow: 0 4px 12px var(--shadow-lavender);
    }

    .choice-card.selected .choice-number {
      background: linear-gradient(145deg, var(--sage-light), var(--sage));
      box-shadow: 0 4px 12px var(--shadow-sage);
    }

    .choice-text {
      font-size: 1.02rem;
      font-weight: 600;
    }

    .choice-emoji {
      margin-left: auto;
      font-size: 1.45rem;
    }

    /* Result toast */
    .result-toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      z-index: 300;
      background: var(--bg-card);
      color: var(--text);
      padding: 1rem 1.75rem;
      border-radius: var(--radius-md);
      border: 1.5px solid var(--sage-pale);
      font-weight: 600;
      font-size: 0.95rem;
      box-shadow: 0 12px 36px var(--shadow-sage);
      opacity: 0;
      transition: transform 0.45s cubic-bezier(0.34, 1.4, 0.64, 1), opacity 0.3s ease;
      pointer-events: none;
      white-space: nowrap;
    }

    .result-toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 600px) {
      header {
        padding: 0.85rem 1.25rem;
      }

      .logo-text {
        font-size: 1.2rem;
      }

      .insta-link span.handle {
        display: none;
      }

      .features {
        gap: 0.65rem;
      }

      .feature-chip {
        font-size: 0.8rem;
        border-radius: var(--radius-sm);
      }

      .result-toast {
        white-space: normal;
        text-align: center;
        max-width: 85vw;
      }
    }
  </style>
</head>
<body>

  <div class="bg-blob bg-blob--sage"></div>
  <div class="bg-blob bg-blob--lavender"></div>

  <header>
    <a href="#" class="logo">
      <div class="logo-icon">D</div>
      <div class="logo-text">DayO <span>(돼요)</span></div>
    </a>
    <a href="https://www.instagram.com/dayo.speak" target="_blank" rel="noopener noreferrer" class="insta-link">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
      </svg>
      <span class="handle">@dayo.speak</span>
    </a>
  </header>

  <main>
    <h1 class="hero-title">
      <span class="title-rotator-wrap" aria-live="polite">
        <span class="title-rotator" id="titleRotator">베트남어 🇻🇳</span>
      </span>, 이제<br><em>돼요!</em>
    </h1>
    <p class="hero-subtitle">
      원어민과 눈 마주치며 대화하는 화상 회화 플랫폼, 돼요!
    </p>

    <button class="cta-btn" id="startQuizBtn">
      <span class="emoji">✨</span>
      3초 만에 끝내는 AI 자가진단 퀴즈 시작하기
    </button>

    <div class="features">
      <div class="feature-chip">🎙️ 실시간 코칭</div>
      <div class="feature-chip">🧠 AI 맞춤 피드백</div>
      <div class="feature-chip">🌿 3초 자가진단</div>
    </div>
  </main>

  <!-- Quiz Modal -->
  <div class="modal-overlay" id="quizModal">
    <div class="modal" role="dialog" aria-labelledby="modalTitle" aria-modal="true">
      <button class="modal-close" id="modalClose" aria-label="닫기">✕</button>
      <div class="modal-header">
        <div class="modal-step">STEP 1 / 3</div>
        <h2 class="modal-title" id="modalTitle">나의 스피킹 고민은?</h2>
      </div>
      <div class="choice-cards">
        <button class="choice-card" data-choice="blocked">
          <span class="choice-number">1</span>
          <span class="choice-text">말문이 막힘</span>
          <span class="choice-emoji">😶</span>
        </button>
        <button class="choice-card" data-choice="vocabulary">
          <span class="choice-number">2</span>
          <span class="choice-text">단어가 안 떠오름</span>
          <span class="choice-emoji">🤔</span>
        </button>
        <button class="choice-card" data-choice="pronunciation">
          <span class="choice-number">3</span>
          <span class="choice-text">발음 불안</span>
          <span class="choice-emoji">😰</span>
        </button>
      </div>
    </div>
  </div>

  <div class="result-toast" id="resultToast"></div>

  <script>
    const languages = [
      { name: '베트남어', flag: '🇻🇳' },
      { name: '스페인어', flag: '🇪🇸' },
      { name: '러시아어', flag: '🇷🇺' },
      { name: '영어', flag: '🇺🇸' },
      { name: '중국어', flag: '🇨🇳' },
      { name: '일본어', flag: '🇯🇵' },
      { name: '이탈리아어', flag: '🇮🇹' },
      { name: '프랑스어', flag: '🇫🇷' },
      { name: '독일어', flag: '🇩🇪' }
    ];

    const titleRotator = document.getElementById('titleRotator');
    let langIndex = 0;
    const FADE_MS = 550;
    const INTERVAL_MS = 2000;

    function rotateTitle() {
      titleRotator.classList.add('fade-out');
      setTimeout(() => {
        langIndex = (langIndex + 1) % languages.length;
        const { name, flag } = languages[langIndex];
        titleRotator.textContent = `${name} ${flag}`;
        titleRotator.classList.remove('fade-out');
      }, FADE_MS);
    }

    setInterval(rotateTitle, INTERVAL_MS);

    const startBtn = document.getElementById('startQuizBtn');
    const modal = document.getElementById('quizModal');
    const closeBtn = document.getElementById('modalClose');
    const choiceCards = document.querySelectorAll('.choice-card');
    const toast = document.getElementById('resultToast');

    const choiceLabels = {
      blocked: '말문이 막힘',
      vocabulary: '단어가 안 떠오름',
      pronunciation: '발음 불안'
    };

    function openModal() {
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      modal.classList.remove('active');
      document.body.style.overflow = '';
      choiceCards.forEach(c => c.classList.remove('selected'));
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2800);
    }

    startBtn.addEventListener('click', openModal);

    closeBtn.addEventListener('click', closeModal);

    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('active')) {
        closeModal();
      }
    });

    choiceCards.forEach(card => {
      card.addEventListener('click', () => {
        choiceCards.forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');

        const choice = card.dataset.choice;
        const label = choiceLabels[choice];

        setTimeout(() => {
          closeModal();
          showToast(`"${label}" — DayO가 도와드릴게요! 🌸`);
        }, 400);
      });
    });
  </script>
</body>
</html>
