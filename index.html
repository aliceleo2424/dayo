<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DayO (돼요) — AI 회화 코파일럿</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --neon-green: #58cc02;
      --neon-green-light: #89e219;
      --neon-green-dark: #46a302;
      --purple: #7b2ff7;
      --purple-light: #a855f7;
      --purple-dark: #5b21b6;
      --bg: #0f0a1a;
      --bg-card: #1a1230;
      --text: #ffffff;
      --text-muted: #c4b5fd;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* Background blobs */
    .bg-blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      pointer-events: none;
      z-index: 0;
    }

    .bg-blob--green {
      width: 420px;
      height: 420px;
      background: var(--neon-green);
      top: -120px;
      right: -80px;
      animation: float 8s ease-in-out infinite;
    }

    .bg-blob--purple {
      width: 380px;
      height: 380px;
      background: var(--purple);
      bottom: -100px;
      left: -60px;
      animation: float 10s ease-in-out infinite reverse;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(20px, -30px) scale(1.05); }
    }

    /* Header */
    header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 2rem;
      background: rgba(15, 10, 26, 0.75);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(123, 47, 247, 0.2);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
      color: var(--text);
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, var(--neon-green), var(--neon-green-light));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: 900;
      color: #fff;
      box-shadow: 0 4px 20px rgba(88, 204, 2, 0.45);
      transform: rotate(-4deg);
    }

    .logo-text {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .logo-text span {
      color: var(--neon-green-light);
    }

    .insta-link {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 1.1rem;
      background: linear-gradient(135deg, var(--purple), var(--purple-light));
      border-radius: 999px;
      text-decoration: none;
      color: #fff;
      font-weight: 700;
      font-size: 0.95rem;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 16px rgba(123, 47, 247, 0.4);
    }

    .insta-link:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 6px 24px rgba(123, 47, 247, 0.55);
    }

    .insta-link svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Hero */
    main {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6rem 1.5rem 3rem;
      text-align: center;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 1rem;
      background: rgba(88, 204, 2, 0.15);
      border: 1.5px solid rgba(88, 204, 2, 0.4);
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--neon-green-light);
      margin-bottom: 1.5rem;
      animation: pulse-badge 2.5s ease-in-out infinite;
    }

    @keyframes pulse-badge {
      0%, 100% { box-shadow: 0 0 0 0 rgba(88, 204, 2, 0.3); }
      50% { box-shadow: 0 0 0 8px rgba(88, 204, 2, 0); }
    }

    .hero-title {
      font-size: clamp(2.2rem, 6vw, 3.8rem);
      font-weight: 900;
      line-height: 1.15;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #fff 30%, var(--neon-green-light) 70%, var(--purple-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-subtitle {
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      color: var(--text-muted);
      font-weight: 600;
      max-width: 480px;
      line-height: 1.6;
      margin-bottom: 2.5rem;
    }

    /* CTA Button */
    .cta-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      padding: 1.25rem 2.5rem;
      font-family: inherit;
      font-size: clamp(1.05rem, 2.5vw, 1.3rem);
      font-weight: 800;
      color: #fff;
      background: linear-gradient(180deg, var(--neon-green-light) 0%, var(--neon-green) 50%, var(--neon-green-dark) 100%);
      border: none;
      border-radius: 20px;
      cursor: pointer;
      box-shadow:
        0 6px 0 var(--neon-green-dark),
        0 8px 32px rgba(88, 204, 2, 0.45);
      transition: transform 0.15s, box-shadow 0.15s;
      letter-spacing: -0.01em;
      max-width: 90vw;
    }

    .cta-btn:hover {
      transform: translateY(-3px);
      box-shadow:
        0 9px 0 var(--neon-green-dark),
        0 12px 40px rgba(88, 204, 2, 0.55);
    }

    .cta-btn:active {
      transform: translateY(4px);
      box-shadow:
        0 2px 0 var(--neon-green-dark),
        0 4px 16px rgba(88, 204, 2, 0.35);
    }

    .cta-btn .emoji {
      font-size: 1.4em;
    }

    /* Features strip */
    .features {
      display: flex;
      gap: 1.5rem;
      margin-top: 3.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .feature-chip {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.5rem 1rem;
      background: rgba(123, 47, 247, 0.15);
      border: 1px solid rgba(123, 47, 247, 0.3);
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    /* Modal overlay */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(10, 5, 20, 0.75);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s, visibility 0.3s;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal {
      background: var(--bg-card);
      border: 2px solid rgba(123, 47, 247, 0.35);
      border-radius: 28px;
      padding: 2rem 1.75rem;
      max-width: 480px;
      width: 100%;
      transform: scale(0.85) translateY(20px);
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow:
        0 24px 64px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(88, 204, 2, 0.1);
    }

    .modal-overlay.active .modal {
      transform: scale(1) translateY(0);
    }

    .modal-header {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .modal-step {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--neon-green-light);
      background: rgba(88, 204, 2, 0.15);
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      margin-bottom: 0.75rem;
    }

    .modal-title {
      font-size: 1.5rem;
      font-weight: 900;
      line-height: 1.3;
    }

    .modal-close {
      position: absolute;
      top: 1.25rem;
      right: 1.25rem;
      width: 36px;
      height: 36px;
      background: rgba(255, 255, 255, 0.08);
      border: none;
      border-radius: 50%;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.2s;
    }

    .modal-close:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    .modal {
      position: relative;
    }

    /* Choice cards */
    .choice-cards {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
    }

    .choice-card {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.1rem 1.25rem;
      background: rgba(255, 255, 255, 0.04);
      border: 2px solid rgba(123, 47, 247, 0.25);
      border-radius: 18px;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s, background 0.2s, box-shadow 0.2s;
      text-align: left;
      font-family: inherit;
      color: var(--text);
      width: 100%;
    }

    .choice-card:hover {
      transform: translateX(6px);
      border-color: var(--neon-green);
      background: rgba(88, 204, 2, 0.08);
      box-shadow: 0 4px 20px rgba(88, 204, 2, 0.15);
    }

    .choice-card.selected {
      border-color: var(--neon-green);
      background: rgba(88, 204, 2, 0.12);
      box-shadow: 0 4px 24px rgba(88, 204, 2, 0.25);
    }

    .choice-number {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, var(--purple), var(--purple-light));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 1rem;
    }

    .choice-card.selected .choice-number {
      background: linear-gradient(135deg, var(--neon-green), var(--neon-green-light));
    }

    .choice-text {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .choice-emoji {
      margin-left: auto;
      font-size: 1.5rem;
    }

    /* Result toast */
    .result-toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      z-index: 300;
      background: linear-gradient(135deg, var(--neon-green-dark), var(--neon-green));
      color: #fff;
      padding: 1rem 1.75rem;
      border-radius: 16px;
      font-weight: 800;
      font-size: 1rem;
      box-shadow: 0 8px 32px rgba(88, 204, 2, 0.4);
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s;
      pointer-events: none;
      white-space: nowrap;
    }

    .result-toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 600px) {
      header {
        padding: 0.85rem 1.25rem;
      }

      .logo-text {
        font-size: 1.25rem;
      }

      .insta-link span.handle {
        display: none;
      }

      .features {
        gap: 0.75rem;
      }

      .feature-chip {
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>

  <div class="bg-blob bg-blob--green"></div>
  <div class="bg-blob bg-blob--purple"></div>

  <header>
    <a href="#" class="logo">
      <div class="logo-icon">D</div>
      <div class="logo-text">DayO <span>(돼요)</span></div>
    </a>
    <a href="https://www.instagram.com/dayo.speak" target="_blank" rel="noopener noreferrer" class="insta-link">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/>
      </svg>
      <span class="handle">@dayo.speak</span>
    </a>
  </header>

  <main>
    <div class="hero-badge">🇰🇷 × 🇺🇸 AI 회화 코파일럿</div>
    <h1 class="hero-title">영어, 이제<br>돼요!</h1>
    <p class="hero-subtitle">
      DayO가 옆에서 실시간으로 도와주는<br>
      한국어·영어 AI 스피킹 코파일럿
    </p>

    <button class="cta-btn" id="startQuizBtn">
      <span class="emoji">⚡</span>
      3초 만에 끝내는 AI 자가진단 퀴즈 시작하기
    </button>

    <div class="features">
      <div class="feature-chip">🎙️ 실시간 코칭</div>
      <div class="feature-chip">🧠 AI 맞춤 피드백</div>
      <div class="feature-chip">✨ 3초 자가진단</div>
    </div>
  </main>

  <!-- Quiz Modal -->
  <div class="modal-overlay" id="quizModal">
    <div class="modal" role="dialog" aria-labelledby="modalTitle" aria-modal="true">
      <button class="modal-close" id="modalClose" aria-label="닫기">✕</button>
      <div class="modal-header">
        <div class="modal-step">STEP 1 / 3</div>
        <h2 class="modal-title" id="modalTitle">나의 스피킹 고민은?</h2>
      </div>
      <div class="choice-cards">
        <button class="choice-card" data-choice="blocked">
          <span class="choice-number">1</span>
          <span class="choice-text">말문이 막힘</span>
          <span class="choice-emoji">😶</span>
        </button>
        <button class="choice-card" data-choice="vocabulary">
          <span class="choice-number">2</span>
          <span class="choice-text">단어가 안 떠오름</span>
          <span class="choice-emoji">🤔</span>
        </button>
        <button class="choice-card" data-choice="pronunciation">
          <span class="choice-number">3</span>
          <span class="choice-text">발음 불안</span>
          <span class="choice-emoji">😰</span>
        </button>
      </div>
    </div>
  </div>

  <div class="result-toast" id="resultToast"></div>

  <script>
    const startBtn = document.getElementById('startQuizBtn');
    const modal = document.getElementById('quizModal');
    const closeBtn = document.getElementById('modalClose');
    const choiceCards = document.querySelectorAll('.choice-card');
    const toast = document.getElementById('resultToast');

    const choiceLabels = {
      blocked: '말문이 막힘',
      vocabulary: '단어가 안 떠오름',
      pronunciation: '발음 불안'
    };

    function openModal() {
      modal.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      modal.classList.remove('active');
      document.body.style.overflow = '';
      choiceCards.forEach(c => c.classList.remove('selected'));
    }

    function showToast(message) {
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2800);
    }

    startBtn.addEventListener('click', openModal);

    closeBtn.addEventListener('click', closeModal);

    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && modal.classList.contains('active')) {
        closeModal();
      }
    });

    choiceCards.forEach(card => {
      card.addEventListener('click', () => {
        choiceCards.forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');

        const choice = card.dataset.choice;
        const label = choiceLabels[choice];

        setTimeout(() => {
          closeModal();
          showToast(`"${label}" — DayO가 도와드릴게요! 🎉`);
        }, 400);
      });
    });
  </script>
</body>
</html>
