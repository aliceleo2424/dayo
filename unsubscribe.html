<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>이메일 수신 거부 | DayO</title><style>*{box-sizing:border-box}body{margin:0;background:#FFFBF4;color:#594842;font-family:Apple SD Gothic Neo,Malgun Gothic,sans-serif;line-height:1.7}main{max-width:520px;margin:12vh auto;padding:24px}section{padding:24px;border:1px solid #E8DDBD;border-radius:18px;background:#F8F0E3}h1{font-size:22px}button{border:0;border-radius:12px;background:#5F7D63;color:white;padding:12px 18px;font:inherit}a{color:#5F7D63}</style></head><body><main><section><h1>DayO 이메일 수신 거부</h1><p id="status" role="status">수신 거부를 처리하고 있습니다.</p><button id="retry" hidden>다시 시도</button><p><a href="/">DayO 홈</a></p></section></main><script>
(function(){const status=document.getElementById('status'),retry=document.getElementById('retry');const token=new URLSearchParams(location.hash.slice(1)).get('token');
async function withdraw(){retry.hidden=true;if(!token){status.textContent='이메일에 포함된 수신 거부 링크를 이용해 주세요.';return;}try{const response=await fetch('/api/guidebook-unsubscribe',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token}),signal:AbortSignal.timeout(10000)});const data=await response.json();if(!response.ok||!data.ok)throw Error();status.textContent='DayO 광고성 이메일 수신이 해제되었습니다.';}catch{status.textContent='처리하지 못했습니다. 잠시 후 다시 시도하거나 dayo.speak@gmail.com으로 문의해 주세요.';retry.hidden=false;}}
retry.addEventListener('click',withdraw);withdraw();})();
</script></body></html>
